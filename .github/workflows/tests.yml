name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python modules
        run: python -m py_compile app.py modem_profile.py tg_bot.py carrier_profile.py diag_readonly.py

      - name: Run offline regression tests
        shell: pwsh
        run: |
          python test_carrier_logic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_long_sms_logic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_tg_logic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_dji_qdc507_logic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_migration_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python test_installer_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
